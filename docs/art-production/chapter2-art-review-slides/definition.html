<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Noto+Sans+SC:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #E2E8F0;
            position: relative;
            display: flex;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            color: #3F3F46;
        }
        .top-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: #991B1B;
        }
        .drop-cap {
            position: absolute;
            top: 40px;
            left: -20px;
            font-family: 'Noto Serif SC', serif;
            font-weight: 900;
            font-size: 400px;
            color: rgba(153, 27, 27, 0.08);
            line-height: 1;
            pointer-events: none;
            z-index: 0;
        }
        .content-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 80px 80px 0 120px;
            z-index: 1;
        }
        .left-col {
            flex: 0 0 35%;
            padding-right: 40px;
        }
        .right-col {
            flex: 0 0 65%;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }
        h1 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 900;
            font-size: 72px;
            color: #09090B;
            line-height: 1.1;
            margin-bottom: 40px;
        }
        .definition-item {
            margin-bottom: 40px;
        }
        .term {
            font-family: 'Noto Serif SC', serif;
            font-weight: 900;
            font-size: 36px;
            color: #991B1B;
            margin-bottom: 10px;
        }
        .description {
            font-weight: 300;
            font-size: 24px;
            line-height: 1.6;
        }
        .description strong {
            font-weight: 700;
            color: #09090B;
        }
        .conclusion {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #991B1B;
            font-weight: 700;
            font-size: 28px;
            color: #09090B;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="top-border"></div>
        <div class="drop-cap">01</div>
        <div class="content-wrapper">
            <div class="left-col">
                <h1>先统一<br>什么算<br>“已交付”</h1>
            </div>
            <div class="right-col">
                <div class="definition-item">
                    <div class="term">已交付建模</div>
                    <div class="description">仓库内存在可加载的 GLB；网格、材质与使用位置均可定位。</div>
                </div>
                <div class="definition-item">
                    <div class="term">程序化占位</div>
                    <div class="description">运行时由基础几何拼装；可服务玩法，<strong>不计入正式美术完成度</strong>。</div>
                </div>
                <div class="definition-item">
                    <div class="term">概念参考</div>
                    <div class="description">定义气氛、比例与材质目标；<strong>不等于运行时资产</strong>。</div>
                </div>
                <div class="conclusion">
                    本次审查以“能否在固定英雄镜头中承受近景”为最终判断标准。
                </div>
            </div>
        </div>
    </div>
</body>
</html>
