<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Noto+Sans+SC:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #E2E8F0;
            position: relative;
            display: flex;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            color: #3F3F46;
        }
        .top-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: #991B1B;
        }
        .drop-cap {
            position: absolute;
            top: 360px; /* moved up so it no longer extends past 720px */
            right: 40px;
            font-family: 'Noto Serif SC', serif;
            font-weight: 900;
            font-size: 350px;
            color: rgba(153, 27, 27, 0.06);
            line-height: 1;
            pointer-events: none;
            z-index: 0;
        }
        .content-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 80px 40px 40px 80px; /* keep top padding for title, reduce right/bottom */
            z-index: 1;
        }
        .left-col {
            flex: 0 0 55%;
            padding-right: 24px; /* reduced spacing */
            display: flex;
            flex-direction: column;
        }
        .right-col {
            flex: 0 0 45%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 900;
            font-size: 56px;
            color: #09090B;
            line-height: 1.2;
            margin-bottom: 28px; /* slightly reduced to save height without touching top padding */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            padding: 12px 8px; /* shrink inner padding to reduce rows height */
            text-align: left;
            border-bottom: 1px solid #D1D5DB;
            font-size: 20px;
            line-height: 1.5;
        }
        th {
            font-weight: 700;
            color: #09090B;
            border-bottom: 2px solid #991B1B;
        }
        td:first-child {
            font-weight: 700;
            color: #991B1B;
            width: 15%;
        }
        td:nth-child(2) {
            width: 45%;
        }
        td:nth-child(3) {
            width: 40%;
            font-style: italic;
        }
        .chart-image {
            width: 420px; /* reduced image size to help overall layout */
            height: 420px;
            object-fit: cover;
            border: 1px solid #D1D5DB;
            background-color: #FFF;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="top-border"></div>
        <div class="drop-cap">06</div>
        <div class="content-wrapper">
            <div class="left-col">
                <h1>Pi 是英雄资产，不是功能球体</h1>
                <table>
                    <thead>
                        <tr>
                            <th>项目</th>
                            <th>交付规格</th>
                            <th>验收镜头</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>剪影</td>
                            <td>提灯帽、双肩包、短腿、可见手臂</td>
                            <td>黑色剪影下仍一眼识别</td>
                        </tr>
                        <tr>
                            <td>材质</td>
                            <td>深青主体、棕皮革、磨损铜、暖玻璃、纸页</td>
                            <td>蓝夜与琥珀实用光下层次清晰</td>
                        </tr>
                        <tr>
                            <td>模型</td>
                            <td>3k–8k 三角面；独立材质区与可烘焙表面</td>
                            <td>与近景灯同框不显塑料或碎片化</td>
                        </tr>
                        <tr>
                            <td>动画</td>
                            <td><code>idle-observe</code>、<code>take-note</code>、<code>turn-and-trot</code></td>
                            <td>对应“看见—带回—改路”</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="right-col">
                <img src="/home/ubuntu/pi-city/demo-recordings/memory-wind/02-single-invite.png" alt="Pi英雄角色视觉目标" class="chart-image">
            </div>
        </div>
    </div>
</body>
</html>
