<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Noto+Sans+SC:wght@300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #E2E8F0;
            position: relative;
            display: flex;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            color: #3F3F46;
        }
        .top-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: #991B1B;
        }
        .content-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .left-space {
            flex: 0 0 30%;
            height: 100%;
        }
        .right-content {
            flex: 0 0 70%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 120px;
        }
        h1 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 900;
            font-size: 90px;
            color: #09090B;
            line-height: 1.1;
            margin-bottom: 20px;
        }
        h2 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 900;
            font-size: 54px;
            color: #991B1B;
            line-height: 1.2;
            margin-bottom: 40px;
        }
        p {
            font-weight: 300;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .drop-cap {
            position: absolute;
            bottom: -40px;
            left: 40px;
            font-family: 'Noto Serif SC', serif;
            font-weight: 900;
            font-size: 300px;
            color: rgba(153, 27, 27, 0.05);
            line-height: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="top-border"></div>
        <div class="drop-cap">Pi</div>
        <div class="content-wrapper">
            <div class="left-space"></div>
            <div class="right-content">
                <h1>Pi City 第二章环境资产</h1>
                <h2>美术评审与交付标准</h2>
                <p>基于当前仓库资产盘点 · 2026-08-19</p>
            </div>
        </div>
    </div>
</body>
</html>
